/* V122 partner loading screen — "partnership": the two parts of the P meet and click, light passes over, a gold star arcs in and lands,
   the name rises letter by letter, PARTNERS opens up, a ring shows loading, then the screen lifts like a curtain. No photo. */
#ptSplash{--ease:cubic-bezier(.22,1,.36,1);--snap:cubic-bezier(.34,1.45,.64,1);
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 38%,#121d38 0%,#0a1122 55%,#070c18 100%);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;transition:transform .75s cubic-bezier(.76,0,.24,1)}
#ptSplash.out{transform:translateY(-100%);pointer-events:none}
#ptSplash .sp-in{display:flex;flex-direction:column;align-items:center;transition:opacity .4s ease,transform .75s cubic-bezier(.76,0,.24,1)}
#ptSplash.out .sp-in{opacity:0;transform:translateY(-24px) scale(.96)}
#ptSplash .sp-mark{width:136px;height:136px;overflow:visible}
#ptSplash .sp-ring-bg{fill:none;stroke:rgba(143,179,255,.10);stroke-width:2}
#ptSplash .sp-ring{fill:none;stroke:url(#spRingG);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  transform:rotate(-90deg);transform-origin:70px 70px;animation:spRing 2.6s cubic-bezier(.3,.7,.4,1) .25s forwards}
#ptSplash.done .sp-ring{animation:none;stroke-dashoffset:0;transition:stroke-dashoffset .3s ease-out}
#ptSplash .sp-p{animation:spSettle .45s var(--snap) .86s both}
#ptSplash .sp-stem{opacity:0;transform:translateY(30px);animation:spStem .7s var(--ease) .12s forwards}
#ptSplash .sp-bowl{opacity:0;transform-box:fill-box;transform-origin:0% 50%;transform:translateX(22px) rotate(24deg);animation:spBowl .75s var(--ease) .32s forwards}
#ptSplash .sp-shine{transform:translateX(-60px);animation:spShine .9s cubic-bezier(.45,0,.2,1) 1.05s forwards}
#ptSplash .sp-star{transform-box:fill-box;transform-origin:center;animation:spTw .5s var(--snap) 1.62s both}
#ptSplash .sp-word{display:flex;margin-top:18px;overflow:hidden;padding:0 2px .12em;font-size:31px;font-weight:800;letter-spacing:-.03em;color:#f3f6fc;line-height:1.05}
#ptSplash .sp-word span{display:inline-block;transform:translateY(105%);animation:spRise .7s var(--ease) forwards}
#ptSplash .sp-sub{margin-top:8px;font-size:11px;font-weight:700;color:#8fa0bf;letter-spacing:.08em;opacity:0;animation:spSub .9s var(--ease) 1.5s forwards}
#ptSplash .sp-sub b{color:#ffc23d;font-weight:700}
@keyframes spStem{to{opacity:1;transform:none}}
@keyframes spBowl{to{opacity:1;transform:none}}
@keyframes spSettle{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes spShine{to{transform:translateX(130px)}}

@keyframes spRise{to{transform:none}}

@keyframes spRing{0%{stroke-dashoffset:1}65%{stroke-dashoffset:.3}100%{stroke-dashoffset:.14}}
#ptSplash .sp-p{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){#ptSplash *{animation-duration:.01s!important;animation-delay:0s!important}#ptSplash{transition:opacity .2s}#ptSplash.out{transform:none;opacity:0}}

<script>
/* show / hide the loading screen: first open stays until the intro has played (about 2.2 s), never longer than 15 s */
window.PT_SPLASH_T=Date.now();
function ptSplashShow(){var e=document.getElementById('ptSplash');if(!e)return;window.PT_SPLASH_T=Date.now();e.classList.remove('out','done');}
function ptSplashHide(min){var e=document.getElementById('ptSplash');if(!e)return;var wait=Math.max(0,(min==null?2200:min)-(Date.now()-window.PT_SPLASH_T));
  setTimeout(function(){e.classList.add('done');setTimeout(function(){e.classList.add('out');},min===0?0:320);},wait);}
setTimeout(function(){ptSplashHide(0);},15000);
</script>
